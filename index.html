
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050b14">
  <title>J.A.R.V.I.S. Voice</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050b14;
      color: #d9f4ff;
      font-family: Arial, sans-serif;
    }

    .panel {
      width: min(90%, 420px);
      padding: 32px 24px;
      text-align: center;
      border: 1px solid #17618a;
      border-radius: 18px;
      background: #091725;
      box-shadow: 0 0 30px #0876a533;
    }

    h1 {
      color: #50caff;
      letter-spacing: 4px;
    }

    #status {
      min-height: 48px;
      color: #9dc8dc;
      margin: 24px 0;
    }

    button {
      width: 100%;
      padding: 16px;
      margin: 8px 0;
      border: 1px solid #28a9e8;
      border-radius: 9px;
      background: #0c3854;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .45;
      cursor: default;
    }

    #result {
      margin-top: 20px;
      color: #fff;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main class="panel">
    <h1>J.A.R.V.I.S.</h1>
    <p>VOICE INTERFACE</p>

    <div id="status">SPRACHSYSTEM BEREIT</div>

    <button id="startButton">
      🎙️ SPRACHEINGABE STARTEN
    </button>

    <button id="stopButton" disabled>
      STOPP
    </button>

    <div id="result"></div>
  </main>

  <script>
    "use strict";

    const GITHUB_ORIGIN =
      "https://bd5kv5h44d-max.github.io";

    const Recognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    const statusText =
      document.getElementById("status");

    const resultText =
      document.getElementById("result");

    const startButton =
      document.getElementById("startButton");

    const stopButton =
      document.getElementById("stopButton");

    let recognition = null;
    let sent = false;
    let manuallyStopped = false;

    function updateStatus(message) {
      statusText.textContent = message;
    }

    function startRecognition() {
      if (!Recognition) {
        updateStatus(
          "SPRACHERKENNUNG NICHT UNTERSTÜTZT"
        );
        return;
      }

      if (recognition) {
        return;
      }

      sent = false;
      manuallyStopped = false;
      resultText.textContent = "";

      const currentRecognition = new Recognition();
      recognition = currentRecognition;

      currentRecognition.lang = "de-DE";
      currentRecognition.continuous = false;
      currentRecognition.interimResults = false;
      currentRecognition.maxAlternatives = 1;

      currentRecognition.onstart = function() {
        updateStatus("ICH HÖRE ZU ...");
        startButton.disabled = true;
        stopButton.disabled = false;
      };

      currentRecognition.onresult = function(event) {
        if (sent) return;

        const spoken =
          event.results[0][0].transcript.trim();

        if (!spoken) return;

        sent = true;
        resultText.textContent = spoken;

        if (window.parent === window) {
          updateStatus(
            "VOICE BEREIT – KEINE J.A.R.V.I.S.-EINBETTUNG"
          );
          return;
        }

        window.parent.postMessage(
          {
            type: "JARVIS_VOICE_RESULT",
            text: spoken
          },
          "*"
        );

        updateStatus(
          "TEXT AN J.A.R.V.I.S. ÜBERGEBEN"
        );
      };

      currentRecognition.onerror = function(event) {
        updateStatus(
          "SPRACHFEHLER: " + event.error
        );

        console.error(
          "J.A.R.V.I.S. Voice Fehler:",
          event.error
        );
      };

      currentRecognition.onend = function() {
        if (recognition === currentRecognition) {
          recognition = null;
        }

        startButton.disabled = false;
        stopButton.disabled = true;

        if (!sent && !manuallyStopped) {
          updateStatus(
            "SPRACHERKENNUNG BEENDET"
          );
        }
      };

      try {
        currentRecognition.start();
      } catch (error) {
        recognition = null;

        startButton.disabled = false;
        stopButton.disabled = true;

        updateStatus(
          "STARTFEHLER: " + error.message
        );

        console.error(error);
      }
    }

    function stopRecognition() {
      if (!recognition) return;

      manuallyStopped = true;
      recognition.stop();

      updateStatus("SPRACHERKENNUNG GESTOPPT");
    }

    startButton.addEventListener(
      "click",
      startRecognition
    );

    stopButton.addEventListener(
      "click",
      stopRecognition
    );

    window.addEventListener(
      "message",
      function(event) {

        if (event.source !== window.parent) {
          return;
        }

        if (
          event.origin !==
          "https://script.google.com"
        ) {
          return;
        }

        if (!event.data || typeof event.data !== "object") {
          return;
        }

        if (
          event.data.type ===
          "JARVIS_START_LISTENING"
        ) {
          startRecognition();
        }

        if (
          event.data.type ===
          "JARVIS_STOP_LISTENING"
        ) {
          stopRecognition();
        }
      }
    );

    if (!Recognition) {
      updateStatus(
        "SPRACHERKENNUNG NICHT UNTERSTÜTZT"
      );

      startButton.disabled = true;
    } else {
      updateStatus("SPRACHSYSTEM BEREIT");
    }
  </script>
</body>
</html>
